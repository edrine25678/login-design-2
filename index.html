<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Animated Login Form — TikTok Replicant</title>
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Floating Controls Toolbar -->
  <div class="top-controls">
    <button class="ctrl-btn" id="replayBtn" title="Replay Walk & Push Animation">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Replay Push
    </button>

    <button class="ctrl-btn active" id="soundBtn" title="Toggle Synthesized Audio">
      🔊 Sound: ON
    </button>

    <button class="ctrl-btn" id="skipBtn" title="Skip Intro & Focus Inputs">
      ⏩ Skip Intro
    </button>
  </div>

  <main class="page-wrapper">
    <!-- Centered Stage Scaler -->
    <div class="stage-scaler">
      <div class="stage" id="stageContainer">
        
        <!-- Video Layer (Walk-in & Physical Form Push Sequence) -->
        <div class="video-layer" id="videoLayer">
          <video id="introVideo" src="video.mp4" playsinline muted preload="auto"></video>
        </div>

        <!-- Single Clean Header Title -->
        <h1 class="page-title">Animated login form</h1>

        <!-- Character Interactive Overlay -->
        <div class="character-interactive-layer">
          <div class="speech-bubble" id="speechBubble">Welcome Back! 👋</div>
          <div class="character-privacy-reaction" id="privacyReaction">🙈 Blindfolded</div>
        </div>

        <!-- Fully Organized Interactive Form (Zero Duplication) -->
        <div class="interactive-form-overlay" id="interactiveForm">
          <h2 class="form-title">Welcome Back!</h2>

          <form id="loginForm" autocomplete="off" novalidate>
            
            <!-- Email Field -->
            <div class="form-group">
              <label class="form-label" for="emailInput">
                Email : <span class="req">*</span>
              </label>
              <div class="input-container">
                <span class="input-icon-left">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input 
                  type="email" 
                  id="emailInput" 
                  class="input-field" 
                  placeholder="Enter your email" 
                  required 
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label class="form-label" for="passwordInput">
                Password : <span class="req">*</span>
              </label>
              <div class="input-container">
                <input 
                  type="password" 
                  id="passwordInput" 
                  class="input-field no-icon" 
                  placeholder="Enter your password" 
                  required 
                />
                <button type="button" class="toggle-pwd-btn" id="togglePwdBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
                  <svg id="eyeIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
              <span class="btn-text">Log In</span>
              <span class="btn-spinner"></span>
            </button>

            <!-- Organized Disclaimer Notice -->
            <div class="disclaimer-text">
              Never submit passwords through Visme forms.<br />
              <a href="#" class="disclaimer-link" onclick="return false;">Report malicious form</a>
            </div>

          </form>

        </div>

        <!-- Powered by Visme Forms Pill (Single-line, no awkward wrapping) -->
        <a href="#" class="powered-badge" onclick="return false;">
          Powered by Visme Forms
        </a>

        <!-- Confetti Canvas -->
        <canvas id="confettiCanvas"></canvas>

      </div>
    </div>

    <!-- Color Palette Dock -->
    <div class="palette-dock">
      <span>Exact Colors:</span>
      <div class="palette-swatches">
        <div class="swatch-item" title="Primary Canvas Background">
          <div class="color-dot" style="background: #c95b02;"></div>
          <code>#c95b02</code>
        </div>
        <div class="swatch-item" title="Midnight Navy Typography">
          <div class="color-dot" style="background: #012031;"></div>
          <code>#012031</code>
        </div>
        <div class="swatch-item" title="Input Background">
          <div class="color-dot" style="background: #ffffff;"></div>
          <code>#ffffff</code>
        </div>
        <div class="swatch-item" title="Button Background">
          <div class="color-dot" style="background: #000000;"></div>
          <code>#000000</code>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
